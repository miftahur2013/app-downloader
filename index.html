<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <title>App Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px;
    }
    .card { 
      background: white;

    p { color: #666; font-size: 15px; margin-bottom: 25px; }

      background: #f1f5f9;
      padding: 12px;
      border-radius: 10px;
      border: 1px dashed #cbd5e1;
      font-size: 13px;
      color: #475569;
      word-break: break-all;
      margin-bottom: 25px;
    }

    .download-btn { 
      display: block; 
      width: 100%; 
      padding: 16px; 
      background: #22c55e; 
      color: white; 
      text-decoration: none; 
      border-radius: 12px; 
      font-size: 18px; 
      font-weight: bold; 
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
      transition: 0.2s;
    }
    .download-btn:hover { background: #16a34a; transform: translateY(-2px); }
  </style>
</head>
<body>
